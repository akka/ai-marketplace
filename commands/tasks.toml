description = "Generate an actionable, dependency-ordered tasks.md for the feature based on available design artifacts."

prompt = """
## User Input

```text
{{args}}
```

You **MUST** consider the user input before proceeding (if not empty).

## Before anything else

This command keeps a run in the idea's record when the akka CLI has one: the
`akka_run_start` MCP tool is available, or the output of `akka specify run start
--help` contains `--station`. A CLI without it predates the idea record. With
such a CLI, say so once and carry this command out as before: skip every step
marked **Idea record**, and open no run.

**Idea record: a console run.** Call the `akka_run_context` MCP tool first when
it is available: it answers `{ console, idea, station, run }`, and `console:
true` means the console started this command. Only without that tool, the
console started it when `AKKA_RUN_ID` is set in its environment, or when the
command has no shell to run the akka CLI in. The console has already opened the
run and enforced the rules for it, so in a console run the run is open from the
first step: its id is the `run` `akka_run_context` answered. Any stop before the
normal close, such as a mode-check refusal, a missing argument, or a check that
needs a tool this run lacks, closes it with `akka_run_close`, that `run`,
`outcome: failed` and the reason. So in a console run: the feature is
`akka_run_context`'s `spec` (for `/akka:discover`, the topic is its `topic`),
and the command never searches for one; skip every step that finds, adopts,
starts or links an idea, and never ask a person a question: wherever this
command would ask one, it closes the run with `outcome: waiting` and `question`
set to the question (`--outcome waiting --question "<question>"` on the CLI);
the owner answers in the console, and the re-run reads the answer from
`akka_run_context`'s `questions` (`{station, run, question, answer}`) and does
not ask it again; run the mode check with `--idea` set to the `idea`
`akka_run_context` answered, and skip it when it cannot run here or no idea is
known; open the run by calling `akka_run_start` with `command` and `args` only,
no `idea` and no `station`, and the CLI joins the console's run; close it as
usual; and skip the carry-on step, because the console moves the idea on. A run
with no shell for the akka CLI that `akka_run_context` answers `console: false`
for is not a console run and keeps no record: open no run, ask nothing about
ideas or lanes, and carry the command out as before the idea record, skipping
every step marked **Idea record**.

**Idea record: find the idea.** On a laptop run, find the feature this command
works on first: call `akka_sdd_list_specs` and identify the target feature as
the first step below does. Its idea is the one in `akka specify idea list
--json` whose `spec` is the feature's folder name (`NNN-name`); an idea is never
found from the git branch. When that idea has `derived: true`, it has no record
yet: adopt it with `akka specify ideas adopt --idea <id>`, then use it. When no
idea has it, read the mode with `akka specify mode`. In À la carte mode, open no
run: say in one line that this run is not recorded, and continue. In Enforced
mode, stop: the project's specs and topics get their ideas once with `akka
specify ideas adopt`, and this command runs after that. Pass the idea's id as
`--idea <id>` to the mode check and `idea` to the run start.

Run `akka specify mode --allows tasks`, adding `--idea <id>` when the idea
record found the idea. With a CLI that predates the idea record, add
`--as-engine` when you are carrying this command out as a step of the sequence
`/akka:specify` drives in Enforced mode, rather than because a person invoked
it. It exits non-zero when the project's mode does not permit the command. On a
non-zero exit, print its message verbatim and stop. Do not continue, and do not
work around it. The one exception is a CLI that rejects `--allows` as an unknown
flag: it predates the mode check (older than 3.0.74), so say so and continue
without the check.

With the idea record, Enforced mode runs a station command when the idea's
previous station is done and approved, and the CLI's run start decides;
`/akka:specify` does not drive the sequence. With an older CLI, Enforced mode
gives the sequence to the engine, so a step it sequences is refused to a person
and permitted to the engine. A refusal with a reason of its own, such as
re-running setup, stands either way. The message names the remedy.

**Idea record: open the run.** On a laptop run, call the `akka_run_start` MCP
tool with `station: tasks`, `command: /akka:tasks`, `idea` set to the idea found
above and `args` set to the user input. Where the tool is not available, run
`akka specify run start --station tasks --command /akka:tasks --idea <id> --args
"<the user input>" --json`, with the input quoted as one argument. A run is
never started without its idea. It answers JSON: `recorded`, and for a recorded
run its `idea` and `run.id`. Keep both: the last steps use them.

- When it answers `recorded: false`, continue without a run, and say in one line
  that this run is not recorded, with its `reason`.
- A refusal by rule is an error whose JSON is `{refused, message, remedy}`,
  `refused` naming the rule: `paused`, `limit`, `shipped`, `dropped`,
  `approval`, `order`, `no-idea-enforced`, `idea-unresolved` or `console-run`.
  Print `message` and `remedy` verbatim and stop.
- Any other error, one without `refused` (such as no login), does not stop the
  command: continue without a run, and say in one line that this run is not
  recorded.

**Idea record: a run that fails is closed too.** Once the run is open, every way
the command ends closes it. When the work fails (a build or tests fail, or a
step stops the command early), call `akka_run_close` with `run`, `outcome:
failed` and `error` set to what failed, in one line, then stop. Where the tool
is not available, run `akka specify run close --run <id> --outcome failed
--error "<what failed>"`. When the person stops the command, close the run with
`outcome: stopped`. This holds in a console run too. The close step below is for
the work's normal end.

## Outline

1. **Setup**: Call the `akka_sdd_list_specs` MCP tool to find features and their available documents. From the response, identify the target feature's FEATURE_DIR and which artifacts exist (AVAILABLE_DOCS: spec.md, plan.md, tasks.md, etc.). If no features exist, instruct the user to run `/akka:specify` first.

2. **Load design documents**: Read from FEATURE_DIR:
   - **Required**: plan.md (tech stack, libraries, structure), spec.md (user stories with priorities)
   - **Optional**: data-model.md (entities), contracts/ (interface contracts), research.md (decisions), quickstart.md (test scenarios)
   - Note: Not all projects have all documents. Generate tasks based on what's available.

3. **Execute task generation workflow**:
   - Load plan.md and extract tech stack, libraries, project structure
   - If plan.md has Delivery Phases and a Model Plan: extract each phase (its `### Phase <n>` heading, goal and acceptance test) and the model for each phase and purpose, to tag tasks with `[Ph<n>]` and `[model: <name>]`
   - Load spec.md and extract user stories with their priorities (P1, P2, P3, etc.)
   - If data-model.md exists: Extract entities and map to user stories
   - If contracts/ exists: Map interface contracts to user stories
   - If research.md exists: Extract decisions for setup tasks
   - Generate tasks organized by user story (see Task Generation Rules below)
   - Generate dependency graph showing user story completion order
   - Create parallel execution examples per user story
   - Validate task completeness (each user story has all needed tasks, independently testable)

4. **Generate tasks.md**: Use `akka_sdd_get_template` as structure, fill with:
   - Correct feature name from plan.md
   - Group 1: Setup tasks (project initialization)
   - Group 2: Foundational tasks (blocking prerequisites for all user stories)
   - Group 3+: One group per user story (in priority order from spec.md)
   - Each group includes: story goal, independent test criteria, tests (if requested), implementation tasks
   - Final Group: Polish & cross-cutting concerns
   - All tasks must follow the strict checklist format (see Task Generation Rules below)
   - Clear file paths for each task
   - A User Story Dependencies section with one line per user story, `- **USn**: <stories it needs> (why)`, or `- **USn**: none (why)` for a story that needs no other; every story has a line, and the console reads these lines
   - Parallel execution examples per story
   - Implementation strategy section (MVP first, incremental delivery)

5. **Refresh the docs.** If the project has a `discovery/` folder, run `/akka:docs` (the implementation docs and the Story) before reporting, in this session, so they match what this command wrote, and keep its outcome for the report. If the project has no `discovery/` folder, do not run `/akka:docs`; offer it in the report as an optional next step, and leave `docs/` untouched.

6. **Report**: Output path to generated tasks.md and summary:
   - Total task count
   - Task count per user story
   - Parallel opportunities identified
   - Independent test criteria for each story
   - Suggested MVP scope (typically just User Story 1)
   - Format validation: Confirm ALL tasks follow the checklist format (checkbox, ID, labels, file paths)

7. **Close the run**. If a run was opened, call the `akka_run_close` MCP tool with `run` set to its id and `outputs` set to `FEATURE_DIR/tasks.md` as a project-relative path, with `docs/` when the docs refresh ran. Where the tool is not available, run `akka specify run close --run <id>` with one `--output <path>` for each output. On an error, print its message; the tasks already written stand.

8. **Idea record: end waiting for approval.** When a run was opened, the tasks now wait for the owner's approval before Implement runs, in either mode. Say so and, when a run was opened, say how to give it: on the idea in the console's Ideas page, or `akka specify idea approve <idea> tasks`, where `<idea>` is the idea `akka_run_start` named. Do not carry out `/akka:implement` or any later station. Name `/akka:implement` as the command for after the approval.

Context for task generation: {{args}}

The tasks.md should be immediately executable - each task must be specific enough that an LLM can complete it without additional context.

## Task Generation Rules

**CRITICAL**: Tasks MUST be organized by user story to enable independent implementation and testing.

**Tests are OPTIONAL**: Only generate test tasks if explicitly requested in the feature specification or if user requests TDD approach.

### Checklist Format (REQUIRED)

Every task MUST strictly follow this format:

```text
- [ ] [TaskID] [P?] [Ph<phase>?] [Story?] [model: <name>?] [effort: <level>?] Description with file path
```

**Format Components**:

1. **Checkbox**: ALWAYS start with `- [ ]` (markdown checkbox)
2. **Task ID**: Sequential number (T001, T002, T003...) in execution order
3. **[P] marker**: Include ONLY if task is parallelizable (different files, no dependencies on incomplete tasks)
4. **[Story] label**: REQUIRED for user story group tasks only
   - Format: [US1], [US2], [US3], etc. (maps to user stories from spec.md)
   - Setup group: NO story label
   - Foundational group: NO story label
   - User Story groups: MUST have story label
   - Polish group: NO story label
5. **[Ph<phase>] tag**: REQUIRED when plan.md has a Delivery Phases section, otherwise omitted
   - Format: [Ph1], [Ph2], ... naming the plan's `### Phase <n>` heading the task delivers
   - Every phase in plan.md has at least one task, and no task names a phase plan.md does not have
   - This is the plan's delivery phase. It is independent of this file's own numbered groups (Setup, Foundational, one per user story), so a task in "Group 3: User Story 1" may carry [Ph2]
6. **[model: <name>] tag**: OPTIONAL
   - Include it when plan.md's Model Plan has a row for the task's phase and purpose (design, implementation, review, tests, research, visual checks, documentation); use that row's model
   - Omit it when there is no Model Plan; `/akka:implement` then chooses from `.akka/models.md`
7. **[effort: low|medium|high] tag**: OPTIONAL
   - Write it directly after the `[model: <name>]` tag, using the effort in the same Model Plan row
   - Omit it whenever the `[model: <name>]` tag is omitted
8. **Description**: Clear action with exact file path

**Examples**:

- CORRECT: `- [ ] T001 Create project structure per implementation plan`
- CORRECT: `- [ ] T005 [P] Implement authentication middleware in src/middleware/auth.py`
- CORRECT: `- [ ] T012 [P] [US1] Create User model in src/models/user.py`
- CORRECT: `- [ ] T014 [US1] Implement UserService in src/services/user_service.py`
- CORRECT: `- [ ] T015 [P] [Ph2] [US1] [model: sonnet] [effort: medium] Create Order record in src/main/java/com/example/domain/Order.java`
- WRONG: `- [ ] T016 [US1] [Ph2] Create model in src/models/order.py` (phase tag after the story label)
- WRONG: `- [ ] Create User model` (missing ID and Story label)
- WRONG: `T001 [US1] Create model` (missing checkbox)
- WRONG: `- [ ] [US1] Create User model` (missing Task ID)
- WRONG: `- [ ] T001 [US1] Create model` (missing file path)

### Task Organization

1. **From User Stories (spec.md)** - PRIMARY ORGANIZATION:
   - Each user story (P1, P2, P3...) gets its own group
   - Map all related components to their story:
     - Models needed for that story
     - Services needed for that story
     - Interfaces/UI needed for that story
     - If tests requested: Tests specific to that story
   - Mark story dependencies (most stories should be independent) as the User Story Dependencies lines

2. **From Contracts**:
   - Map each interface contract → to the user story it serves
   - If tests requested: Each interface contract → contract test task [P] before implementation in that story's group

3. **From Data Model**:
   - Map each entity to the user story(ies) that need it
   - If entity serves multiple stories: Put in earliest story or Setup group
   - Relationships → service layer tasks in appropriate story group

4. **From Setup/Infrastructure**:
   - Shared infrastructure → Setup group (Group 1)
   - Foundational/blocking tasks → Foundational group (Group 2)
   - Story-specific setup → within that story's group

### Group Structure

- **Group 1**: Setup (project initialization)
- **Group 2**: Foundational (blocking prerequisites - MUST complete before user stories)
- **Group 3+**: User Stories in priority order (P1, P2, P3...)
  - Within each story: Tests (if requested) → Models → Services → Endpoints → Integration
  - Each group should be a complete, independently testable increment
- **Final Group**: Polish & Cross-Cutting Concerns

## Done When

- [ ] `FEATURE_DIR/tasks.md` was written using the template returned by `akka_sdd_get_template` (or the built-in fallback if the template call returned empty).
- [ ] Group structure is Group 1 Setup, Group 2 Foundational, Group 3+ one group per user story in priority order, and a Final Polish group.
- [ ] Every task line strictly matches `- [ ] TXXX [P?] [Ph<phase>?] [Story?] [model: <name>?] [effort: <level>?] <description with file path>` — task ID, optional `[P]` parallel marker, `[Ph<n>]` delivery-phase tag on every task when plan.md has Delivery Phases, `[US#]` label on user-story-group tasks only, `[model: <name>]` and `[effort: <level>]` only where the Model Plan names them, and an exact file path.
- [ ] When plan.md has Delivery Phases, every phase has at least one task and every `[Ph<n>]` names a phase that exists.
- [ ] Task IDs are sequential (`T001, T002, …`) and unique across the file.
- [ ] Every user story from spec.md has all needed tasks and is independently testable per the story goal and independent test criteria in its group header.
- [ ] The User Story Dependencies section has one `- **USn**: <stories it needs> (why)` line for every user story, which also sets the completion order, and a Parallel Execution Examples subsection is provided per story.
- [ ] With a `discovery/` folder, `/akka:docs` ran before the report; without one, it was offered as a next step and `docs/` was left untouched.
- [ ] The report includes total task count, per-story count, parallel opportunities, and the suggested MVP scope (typically User Story 1 only).
- [ ] The run was opened with `akka_run_start` after the mode check, against the idea found from its feature, and closed with `akka_run_close` naming `tasks.md`, or the CLI was reported as predating the idea record.
- [ ] With a run, the command ended waiting for the owner's approval of the tasks, and no later station was carried out.
"""
