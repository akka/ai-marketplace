name: Prepare plugin version bump

# Opens a PR that sets every plugin descriptor to the given version via
# bin/set-plugin-versions.sh. Merge the PR first, then tag & publish the
# GitHub release from the resulting `main` commit — that way the tagged
# commit already carries the bumped versions.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (e.g. v2.5.0 or 2.5.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set plugin versions
        run: bin/set-plugin-versions.sh "${{ inputs.version }}"

      - name: Open PR with version bump
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # The default GITHUB_TOKEN can push and open the PR, but the PR
          # won't trigger the `harnesses` workflow. Set `token: ${{ secrets.PAT }}`
          # if you want checks to run on this PR automatically.
          base: main
          branch: chore/bump-plugin-versions-${{ inputs.version }}
          delete-branch: true
          title: "chore: bump akka plugin to ${{ inputs.version }}"
          commit-message: "chore: bump akka plugin to ${{ inputs.version }}"
          body: |
            Prepared by `bin/set-plugin-versions.sh` for the upcoming
            **${{ inputs.version }}** release.

            Only the `akka` plugin and its harness descriptors are updated;
            `akka-specify` is intentionally left untouched.

            After merging, cut the tag & release from the resulting `main`
            commit so the tagged artifact carries the bumped versions:

            ```sh
            git switch main && git pull
            gh release create ${{ inputs.version }} \
              --title ${{ inputs.version }} \
              --target main \
              --generate-notes
            ```
